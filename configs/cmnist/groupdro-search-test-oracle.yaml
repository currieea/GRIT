# Test-oracle track of groupdro-search.yaml: selection on test_ood, reported only as the
# paper's "oracle validation" envelope. Same seeds and grid, separate output tree.
schema_version: grit.production-search/v1
dataset: cmnist
protocol_id: cmnist/v1
experiment_name: cmnist-groupdro-openai-clip-test-oracle
experiment_variant: primary_unnormalized
normalization: none
artifacts:
  dataset_manifest: ${PROJECT_SCRATCH}/artifacts/cmnist-none/dataset-manifest.json
  feature_cache_manifest: ${PROJECT_SCRATCH}/artifacts/cmnist-none/feature-cache/manifest.json
  oracle_pair_manifest: ${PROJECT_SCRATCH}/artifacts/cmnist-none/pair-manifest.json
seeds:
  construction: 1729
  pairs: 2718
  stages:
    tuning: [1101, 1102, 1103]
    confirmation: [2101, 2102]
    final: [3101, 3102, 3103, 3104, 3105, 3106, 3107, 3108, 3109, 3110]
search_space:
  methods: [groupdro]
  learning_rates: [1e-4, 3e-4, 1e-3, 3e-3]
  weight_decays: [0.0, 1e-5, 1e-4, 1e-3]
  groupdro_step_sizes: [1e-3, 1e-2, 1e-1]
selectors: [test_oracle]
pair_count: 256
batch_size: 256
max_epochs: 40
output_root: ${PROJECT_SCRATCH}/outputs/cmnist-groupdro-test-oracle
runtime:
  device: cpu
  deterministic_algorithms: true
  workers: 1
relative_singular_value_tolerance: 1e-12
