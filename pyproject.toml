[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grit-research"
version = "0.1.0"
description = "Rigorous invariant feature projection experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grit"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# The inherited top-level implementation is preserved as historical evidence. New Python
# implementation belongs under src/grit, with tests under tests.
[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.basedpyright]
include = ["src/grit", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
