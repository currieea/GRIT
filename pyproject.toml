[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grit-research"
version = "0.1.0"
description = "Rigorous invariant feature projection experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
cpu = [
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
    "torch==2.11.0",
    "torchvision==0.26.0",
]
cu128 = [
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.scripts]
grit = "grit.cli.main:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grit"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# The inherited top-level implementation is preserved as historical evidence. New Python
# implementation belongs under src/grit, with tests under tests.
[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.basedpyright]
include = ["src/grit", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
